version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 15
    groups:
      dotnet-core:
        patterns:
          - System.*
          - Microsoft.AspNetCore.*
          - Microsoft.Extensions.*
      aspire:
        patterns:
          - Aspire.AppHost.*
          - Aspire.Hosting
          - Aspire.Hosting.*
      open-telemetry:
        patterns:
          - OpenTelemetry
          - OpenTelemetry.*
      microsoft-test-platform:
        patterns:
          - Microsoft.Testing.Extensions.*
          - Microsoft.Testing.Platform
          - Microsoft.Testing.Platform.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      # Third tuesday of month
      interval: cron
      cronjob: "0 0 15-21 * 2"
