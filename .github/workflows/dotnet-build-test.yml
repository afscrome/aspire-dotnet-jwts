name: Dotnet Build & Test

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Optional prefix for published artifact names
        required: false
        default: ''
        type: string
      runs-on:
        description: Runner label to use for the build job
        required: false
        default: ubuntu-latest
        type: string
      solution-path:
        description: Solution or solution filter to build
        required: false
        default: ''
        type: string
    outputs:
      nuget_package_artifact_id:
        description: Artifact id for uploaded NuGet packages
        value: ${{ jobs.build-test.outputs.nuget_package_artifact_id }}
      publish_artifact_id:
        description: Artifact id for uploaded publish output
        value: ${{ jobs.build-test.outputs.publish_artifact_id }}
      binlog_artifact_id:
        description: Artifact id for uploaded binlogs
        value: ${{ jobs.build-test.outputs.binlog_artifact_id }}
      testresults_artifact_id:
        description: Artifact id for uploaded test results
        value: ${{ jobs.build-test.outputs.testresults_artifact_id }}
      coverage_report_artifact_id:
        description: Artifact id for uploaded coverage report
        value: ${{ jobs.build-test.outputs.coverage_report_artifact_id }}

jobs:
  build-test:
    name: 🛠️ Dotnet Build Test Publish
    runs-on: ${{ inputs.runs-on }}
    outputs:
      nuget_package_artifact_id: ${{ steps.upload-nuget-packages.outputs.artifact-id }}
      publish_artifact_id: ${{ steps.upload-publish-artifacts.outputs.artifact-id }}
      binlog_artifact_id: ${{ steps.upload-binlogs.outputs.artifact-id }}
      testresults_artifact_id: ${{ steps.upload-test-results.outputs.artifact-id }}
      coverage_report_artifact_id: ${{ steps.upload-coverage-report.outputs.artifact-id }}
    env:
      ARTIFACTS_PATH: ${{ github.workspace }}/.artifacts
      BINLOG_PATH: ${{ github.workspace }}/.artifacts/binlogs
      TESTRESULTS_PATH: ${{ github.workspace }}/.artifacts/testresults
      PACK_PATH: ${{ github.workspace }}/.artifacts/package/release
      PUBLISH_PATH: ${{ github.workspace }}/.artifacts/publish
      COVERAGE_REPORT_PATH: ${{ github.workspace }}/.artifacts/coverage-report
      ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
      ARTIFACT_RETENTION_DAYS: ${{ github.ref_name == github.event.repository.default_branch && 90 || 7 }}
      NUGET_XMLDOC_MODE: skip
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v6

      - name: 🔒 Trust dev certs
        id: trust-dev-certs
        if: ${{ runner.os == 'Linux' }}
        background: true
        run: |
          EXIT_CODE=0
          dotnet dev-certs https --trust || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 4 ]; then
            echo "dev-certs https --trust failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
        shell: bash

      - name: 📥 Restore
        id: restore
        run: |
          DOTNET_TARGET=()
          if [ -n "${{ inputs.solution-path }}" ]; then
            DOTNET_TARGET+=("${{ inputs.solution-path }}")
          fi
          dotnet restore "${DOTNET_TARGET[@]}" \
            --artifacts-path "${{ env.ARTIFACTS_PATH }}" \
            --verbosity:minimal \
            -bl:${{ env.BINLOG_PATH }}/restore.binlog
        shell: bash

      - name: 🔨 Build
        id: build
        run: |
          DOTNET_TARGET=()
          if [ -n "${{ inputs.solution-path }}" ]; then
            DOTNET_TARGET+=("${{ inputs.solution-path }}")
          fi
          dotnet build "${DOTNET_TARGET[@]}" \
            --no-restore \
            --configuration Release \
            --verbosity:minimal \
            --artifacts-path "${{ env.ARTIFACTS_PATH }}" \
            -bl:${{ env.BINLOG_PATH }}/build.binlog
        shell: bash

      - wait: trust-dev-certs

      - name: 🧪 Test
        id: test
        run: |
          DOTNET_TARGET=()
          if [ -n "${{ inputs.solution-path }}" ]; then
            DOTNET_TARGET+=("${{ inputs.solution-path }}")
          fi
          dotnet test "${DOTNET_TARGET[@]}" \
            --configuration Release \
            --verbosity:minimal \
            --artifacts-path "${{ env.ARTIFACTS_PATH }}" \
            -bl:${{ env.BINLOG_PATH }}/test.binlog \
            -- \
            --output Detailed \
            --results-directory "${{ env.TESTRESULTS_PATH }}" \
            --coverage \
            --coverage-output-format cobertura \
            --report-trx
        shell: bash

      - name: 📦 Pack
        id: pack
        run: |
          DOTNET_TARGET=()
          if [ -n "${{ inputs.solution-path }}" ]; then
            DOTNET_TARGET+=("${{ inputs.solution-path }}")
          fi
          dotnet pack "${DOTNET_TARGET[@]}" \
            --no-build \
            --no-restore \
            --artifacts-path "${{ env.ARTIFACTS_PATH }}" \
            --configuration Release \
            -bl:${{ env.BINLOG_PATH }}/pack.binlog
        shell: bash

      - name: 🚀 Publish
        id: publish
        run: |
          DOTNET_TARGET=()
          if [ -n "${{ inputs.solution-path }}" ]; then
            DOTNET_TARGET+=("${{ inputs.solution-path }}")
          fi
          dotnet publish "${DOTNET_TARGET[@]}" \
            --no-build \
            --no-restore \
            --artifacts-path "${{ env.ARTIFACTS_PATH }}" \
            --configuration Release \
            -bl:${{ env.BINLOG_PATH }}/publish.binlog
        shell: bash

      - parallel:
          - name: 📤 Upload NuGet packages
            id: upload-nuget-packages
            uses: actions/upload-artifact@v7
            if: ${{ hashFiles(format('{0}/**', env.PACK_PATH)) != '' }}
            with:
              name: ${{ env.ARTIFACT_PREFIX }}NuGetPackages
              path: ${{ env.PACK_PATH }}
              if-no-files-found: error
              retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

          - name: 📤 Upload Publish Artifacts
            id: upload-publish-artifacts
            uses: actions/upload-artifact@v7
            if: ${{ hashFiles(format('{0}/**', env.PUBLISH_PATH)) != '' }}
            with:
              name: ${{ env.ARTIFACT_PREFIX }}PublishArtifacts
              path: ${{ env.PUBLISH_PATH }}
              if-no-files-found: error
              retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

          - name: 📤 Publish binlogs (on failure)
            id: upload-binlogs
            uses: actions/upload-artifact@v7
            if: >-
              ${{
                always()
                && (
                  runner.debug
                  || steps.restore.outcome == 'failure'
                  || steps.build.outcome == 'failure'
                  || steps.test.outcome == 'failure'
                  || steps.pack.outcome == 'failure'
                )
              }}
            with:
              name: ${{ env.ARTIFACT_PREFIX }}Binlogs-${{ github.job }}
              path: ${{ env.BINLOG_PATH }}
              retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

          - name: 📤 Publish test artifacts (on failure)
            id: upload-test-results
            uses: actions/upload-artifact@v7
            if: ${{ steps.test.outcome == 'failure' || runner.debug }}
            with:
              name: ${{ env.ARTIFACT_PREFIX }}TestResults-${{ github.job }}
              path: ${{ env.TESTRESULTS_PATH }}
              retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

          - name: 📊 Generate coverage report
            id: generate-coverage-report
            uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
            if: ${{ always() && steps.test.outcome != 'skipped' }}
            with:
              reports: ${{ env.TESTRESULTS_PATH }}/*.cobertura.xml
              targetdir: ${{ env.COVERAGE_REPORT_PATH }}
              reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub
              title: Code Coverage

      - parallel:
          - name: 📤 Upload coverage report
            id: upload-coverage-report
            uses: actions/upload-artifact@v7
            if: ${{ steps.generate-coverage-report.outcome == 'success' }}
            with:
              name: ${{ env.ARTIFACT_PREFIX }}CoverageReport
              path: ${{ env.COVERAGE_REPORT_PATH }}
              if-no-files-found: error
              retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

          - name: 📝 Publish coverage summary
            if: ${{ steps.generate-coverage-report.outcome == 'success' }}
            run: cat "${{ env.COVERAGE_REPORT_PATH }}/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"
            shell: bash
