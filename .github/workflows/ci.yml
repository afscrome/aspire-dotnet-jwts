name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    uses: ./.github/workflows/dotnet-build-test.yml
    permissions:
      contents: read
    with:
      artifact-prefix: ${{ matrix.runner }}-
      runs-on: ${{ matrix.runner }}

  publish:
    name: 📦 Publish
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: write

    steps:
      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Download packages
        uses: actions/download-artifact@v8
        with:
          name: ubuntu-latest-NuGetPackages
          path: packages

      - name: 🚀 Publish to GitHub Packages
        run: dotnet nuget push packages/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
        shell: bash
